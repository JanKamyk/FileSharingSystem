<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Ephemeral File Sharing Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800">
    <div class="max-w-5xl mx-auto py-10 px-4">
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Ephemeral File Sharing Portal</h1>
            <p class="text-gray-500 mt-2">Scanning directory: <span class="font-mono text-gray-700">{{ shared_dir }}</span></p>
        </header>

        <main>
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Filename
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Size
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Modified
                                </th>
                                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            {% if files %}
                                {% for file in files %}
                                <tr>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                                        {{ file.filename }}
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                        {{ file.size }}
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                        {{ file.modified }}
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium" id="action-{{ loop.index }}">
                                        <button onclick="shareFile('{{ file.filename }}', 'action-{{ loop.index }}')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-1 px-3 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                                            Share
                                        </button>
                                    </td>
                                </tr>
                                {% endfor %}
                            {% else %}
                                <tr>
                                    <td colspan="4" class="px-6 py-4 text-center text-sm text-gray-500">
                                        No files found in the shared directory.
                                    </td>
                                </tr>
                            {% endif %}
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function shareFile(filename, containerId) {
            const container = document.getElementById(containerId);
            const originalHtml = container.innerHTML;

            // Set loading state
            container.innerHTML = '<span class="text-gray-500 font-medium">Uploading...</span>';

            try {
                const response = await fetch(`/api/share/${encodeURIComponent(filename)}`, {
                    method: 'POST'
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Upload failed');
                }

                // Replace with clickable link
                container.innerHTML = `<a href="${data.link}" target="_blank" class="text-indigo-600 hover:text-indigo-900 font-medium underline">Link</a>`;

            } catch (error) {
                console.error('Error sharing file:', error);
                alert(`Failed to share ${filename}: ${error.message}`);
                // Revert to original button on failure
                container.innerHTML = originalHtml;
            }
        }
    </script>
</body>
</html>
